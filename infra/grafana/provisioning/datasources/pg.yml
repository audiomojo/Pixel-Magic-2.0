apiVersion: 1
# Both datasources log in as the read-only role pm_reader (infra/postgres/init.sql): SELECT only.
datasources:
  - name: pixelmagic
    uid: pixelmagic
    type: grafana-postgresql-datasource
    access: proxy
    url: postgres:5432
    user: pm_reader
    jsonData:
      database: pixelmagic
      sslmode: disable
      postgresVersion: 1600
      timescaledb: false
    secureJsonData:
      password: pm_reader
    editable: false
  - name: temporal_visibility
    uid: temporal_visibility
    type: grafana-postgresql-datasource
    access: proxy
    url: postgres:5432
    user: pm_reader
    jsonData:
      database: temporal_visibility
      sslmode: disable
      postgresVersion: 1600
      timescaledb: false
    secureJsonData:
      password: pm_reader
    editable: false
