[project]
name = "pixelmagic-ai"
version = "0.1.0"
description = "Pixel Magic 2.0 AI worker: describes photos and trains the taste model that marks the pick in each similar set"
requires-python = ">=3.13,<3.14"
dependencies = [
  "temporalio==1.34.0",
  "psycopg[binary]==3.3.6",
  "numpy==2.5.3",
  "scipy==1.18.1",
  "pillow==12.3.0",
  "pillow-heif==1.8.0",
  "rawpy==0.27.1",
]

[project.optional-dependencies]
ml = [
  "torch==2.14.1",
  "transformers==5.19.0",
  "aesthetic-predictor-v2-5==2024.12.18.1",
]
mac = [
  "pyobjc-framework-Vision==12.2.2; sys_platform == 'darwin'",
]

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "testcontainers[postgres]==4.15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pixelmagic_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "mac: needs macOS (Vision framework)",
  "ml: needs the ml extra (torch, transformers) and model weights",
]
