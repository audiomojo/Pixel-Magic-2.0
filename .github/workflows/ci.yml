# Static checks plus the unit, workflow and browser (harvester page) tests on every push and
# pull request.
# The Postgres-backed tests start throwaway containers (testcontainers), which the
# Ubuntu runner's Docker provides. The corpus, e2e and chaos tiers need the private
# sample corpus (git-ignored), so they stay local: see `make test-smoke` etc.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:coverage
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
